    <text x="6" y="82" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#53605a">11 pairs · lower is better</text>
    <line x1="12" y1="200" x2="174" y2="200" stroke="#b9c6be" stroke-width="1"/>
    <rect x="34" y="121.2" width="46" height="78.8" rx="3" fill="#7c8d84"/>
    <text x="57.0" y="115.2" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11.5" font-weight="500" fill="#1d2420">$4.02</text>
    <text x="57.0" y="215" text-anchor="middle" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#53605a">Tools</text>
    <rect x="104" y="131.2" width="46" height="68.8" rx="3" fill="#215a49"/>
    <text x="127.0" y="125.2" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11.5" font-weight="600" fill="#215a49">$3.51</text>
    <text x="127.0" y="215" text-anchor="middle" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#215a49">+ Python</text>
    <text x="93.0" y="238" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#215a49">−13% (−$0.51)</text>
