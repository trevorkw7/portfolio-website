<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" role="img" aria-label="Headline benchmark comparison: Pass rate, Mean center error, Episode time, and API cost per run">
  <rect width="820" height="260" fill="#fcfcfa"/>
  <text x="24" y="30" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15.5" font-weight="600" fill="#1d2420">Direct joint control vs. + Python interpreter</text>
  <rect x="536" y="19" width="11" height="11" rx="2" fill="#7c8d84"/>
  <text x="553" y="29" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#53605a">Tools only</text>
