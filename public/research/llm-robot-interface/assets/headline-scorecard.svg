    <text x="93.0" y="238" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#215a49">−24% (−2.6 min)</text>
  </g>
  <g transform="translate(618, 0)">
