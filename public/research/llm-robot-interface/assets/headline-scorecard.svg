    <text x="57.0" y="215" text-anchor="middle" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#53605a">Tools</text>
    <rect x="104" y="114.8" width="46" height="85.2" rx="3" fill="#215a49"/>
    <text x="127.0" y="108.8" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11.5" font-weight="600" fill="#215a49">100%</text>
    <text x="127.0" y="215" text-anchor="middle" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#215a49">+ Python</text>
    <text x="93.0" y="238" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#53605a">11/11 both</text>
