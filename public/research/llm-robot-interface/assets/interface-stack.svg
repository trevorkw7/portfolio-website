<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 434" width="820" height="434" role="img" aria-label="The LLM-to-robot interface stack showing four control layers and the two tested conditions">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#215a49"/>
    </marker>
    <marker id="axis-dn" viewBox="0 0 8 8" refX="4" refY="7" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 4 7 L 7 2" fill="none" stroke="#93a39a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="820" height="434" fill="#fcfcfa"/>

  <!-- Title -->
  <text x="28" y="34" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#1d2420">The LLM-to-robot interface stack</text>

  <!-- Left abstraction axis -->
  <text x="28" y="68" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#6b7871">High-level</text>
  <text x="28" y="81" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#8b9890">learned skills</text>
  <line x1="54" y1="92" x2="54" y2="230" stroke="#b9c6be" stroke-width="1.2"/>
  <path d="M 50,225 L 54,231 L 58,225" fill="none" stroke="#b9c6be" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="28" y="248" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#215a49">Low-level</text>
  <text x="28" y="261" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#4f6c5e">raw joints</text>

  <!-- 4-layer aligned stack (x=116..644, width=528) -->
  <!-- Layer 1 -->
  <rect x="116" y="54" width="528" height="46" rx="6" fill="#f2f3ee" stroke="#d8dfd9" stroke-width="1"/>
  <text x="134" y="74" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="600" fill="#2b3934">Hierarchical control (System 1 + 2)</text>
  <text x="134" y="91" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#59665f">Subtask language → learned VLA or world-action model</text>

  <!-- Layer 2 -->
  <rect x="116" y="108" width="528" height="46" rx="6" fill="#f2f3ee" stroke="#d8dfd9" stroke-width="1"/>
  <text x="134" y="128" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="600" fill="#2b3934">Code as policy</text>
  <text x="134" y="145" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#59665f">Standalone script sensing and driving the arm in a closed loop</text>

  <!-- Layer 3 (tested) -->
  <rect x="116" y="162" width="528" height="46" rx="6" fill="#ddebe4" stroke="#8db3a1" stroke-width="1"/>
  <text x="134" y="182" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="600" fill="#16382d">Agentic tool use</text>
  <text x="134" y="199" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#2f4f42">Live observe / move loop, revising between steps</text>

  <!-- Layer 4 (tested) -->
  <rect x="116" y="216" width="528" height="46" rx="6" fill="#cbe2d5" stroke="#62937d" stroke-width="1.1"/>
  <text x="134" y="236" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="600" fill="#133127">Direct action generation</text>
  <text x="134" y="253" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#244437">Raw numerical 5-DOF joint angles sent to the motors</text>

  <!-- Right bracket spanning Layers 3–4 -->
  <path d="M 656,166 L 666,166 L 666,258 L 656,258" fill="none" stroke="#215a49" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="677" y="205" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#215a49">Tested here</text>
  <text x="677" y="221" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#3a594c">Agentic loop</text>
  <text x="677" y="236" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#3a594c">on raw joints</text>

  <!-- Branching connector to Condition A & B -->
  <path d="M 380,262 L 380,278" fill="none" stroke="#215a49" stroke-width="1.4"/>
  <path d="M 380,278 L 214,278 L 214,295" fill="none" stroke="#215a49" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M 380,278 L 606,278 L 606,295" fill="none" stroke="#215a49" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Condition A -->
  <rect x="28" y="301" width="372" height="114" rx="6" fill="#f6f7f4" stroke="#c7d2ca" stroke-width="1.1"/>
  <text x="44" y="324" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#1d2420">Condition A · Tools only</text>
  <line x1="44" y1="334" x2="384" y2="334" stroke="#dce2dd" stroke-width="1"/>
  <text x="44" y="353" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#215a49">observe()</text>
  <text x="176" y="353" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#3b4841">front + wrist cameras &amp; joints</text>
  <text x="44" y="371" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#215a49">move_joints()</text>
  <text x="176" y="371" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#3b4841">raw 5-DOF angles + gripper</text>
  <text x="44" y="389" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#215a49">meter() · finish()</text>
  <text x="176" y="389" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#3b4841">live cost/clock + 3 s hold</text>
  <text x="44" y="406" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#6b7871">All geometry and kinematics happen in model reasoning</text>

  <!-- Condition B -->
  <rect x="420" y="301" width="372" height="114" rx="6" fill="#edf5f0" stroke="#215a49" stroke-width="1.3"/>
  <text x="436" y="324" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#14362b">Condition B · Tools + Python</text>
  <line x1="436" y1="334" x2="776" y2="334" stroke="#bed3c7" stroke-width="1"/>
  <text x="436" y="353" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#215a49">Same 6 tools</text>
  <text x="576" y="353" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#2b453a">identical cameras, joints &amp; meter</text>
  <text x="436" y="371" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#133127">+ compute_python()</text>
  <text x="576" y="371" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#2b453a">read-only Python interpreter</text>
  <text x="436" y="389" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#215a49">No motor access</text>
  <text x="576" y="389" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#2b453a">moves still use move_joints()</text>
  <text x="436" y="406" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#4a6558">No prebuilt IK, grasp macros, or prior trial memory</text>
</svg>
