    <rect x="34" y="163.0" width="46" height="37.0" rx="3" fill="#7c8d84"/>
    <text x="57.0" y="157.0" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11.5" font-weight="500" fill="#1d2420">5.67 mm</text>
    <text x="57.0" y="215" text-anchor="middle" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#53605a">Tools</text>
